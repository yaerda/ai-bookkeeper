name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    env:
      VITE_ENTRA_CLIENT_ID: b8f0b1ac-f397-4b36-b0c6-e557da8decac
      VITE_ENTRA_AUTHORITY: https://aibookkeeper.ciamlogin.com/aibookkeeper.onmicrosoft.com/
      VITE_API_SCOPE: api://dc183072-2c27-4ad0-a6a8-3df3b91de4ad/sync.readwrite
      VITE_API_BASE_URL: https://aibookkeeper-sync-prod-yaerda.azurewebsites.net/api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Test web
        run: npm test

      - name: Lint web
        run: npm run lint

      - name: Build web
        run: npm run build

  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Test backend
        run: npm test

      - name: Build backend
        run: npm run build

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Build with Gradle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: '**/build/reports/lint*'
          retention-days: 7

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ai-bookkeeper-apk
          path: app/build/outputs/apk/debug/ai-bookkeeper-*.apk
          retention-days: 30

  android-integration:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Decode keystore for app UI tests
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Run voice, Room, update and OCR edit regression tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: >-
            ./gradlew :feature-input:connectedDebugAndroidTest :core-data:connectedDebugAndroidTest :app:connectedDebugAndroidTest --no-daemon --stacktrace
            && ./gradlew :feature-capture:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.aibookkeeper.feature.capture.ocr.CaptureBatchEditRegressionTest --no-daemon --stacktrace
