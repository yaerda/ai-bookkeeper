name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Run tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Gate release on voice, chronology, update and OCR edit regressions
        uses: reactivecircus/android-emulator-runner@v2
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: >-
            ./gradlew :feature-input:connectedDebugAndroidTest :core-data:connectedDebugAndroidTest :app:connectedDebugAndroidTest --no-daemon --stacktrace
            && ./gradlew :feature-capture:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.aibookkeeper.feature.capture.ocr.CaptureBatchEditRegressionTest --no-daemon --stacktrace

      - name: Upload Android release gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-gate-reports
          path: |
            **/build/reports/androidTests/connected/
            **/build/outputs/androidTest-results/connected/
          retention-days: 7

      - name: Get APK path
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$APK_PATH" app/build/outputs/apk/release/ai-bookkeeper-latest.apk
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.apk.outputs.path }}
            app/build/outputs/apk/release/ai-bookkeeper-latest.apk
          generate_release_notes: true
